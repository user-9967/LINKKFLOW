  <style>
    :root{
      --bg: #000000;
      --fg: #ffffff;
      --fg-70: rgba(255,255,255,.70);

      --gap: 18px;
    }
    body.theme-light {
      --bg: #f4f4f5;
      --fg: #09090b;
      --fg-70: rgba(9, 9, 11, .70);
      --fg-50: rgba(9, 9, 11, .50);
      --fg-30: rgba(9, 9, 11, .28);
      --fg-15: rgba(9, 9, 11, .14);
    }
    body.theme-light .stars-bg { opacity: 0.05; filter: invert(1); }
    body.theme-light .dither { filter: invert(1); opacity: 0.1; }
    body.theme-light .corner { border-color: #09090b; opacity: 0.2; }
    body.theme-light .card { background: rgba(0,0,0,.015); }
    *{ box-sizing:border-box; }

    body{
      background:var(--bg);
      color:var(--fg);
      font-family:var(--mono);
      min-height:100vh;
      position:relative;
      overflow-x:hidden;
      -webkit-font-smoothing:antialiased;
      transition: background 0.3s ease, color 0.3s ease;
    }
    .stars-bg{
      position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.35;
      background-image:
        radial-gradient(1px 1px at 12% 22%, #fff, transparent),
        radial-gradient(1px 1px at 62% 68%, #fff, transparent),
        radial-gradient(1px 1px at 48% 40%, #fff, transparent),
        radial-gradient(1px 1px at 82% 14%, #fff, transparent),
        radial-gradient(1px 1px at 91% 58%, #fff, transparent),
        radial-gradient(1px 1px at 30% 82%, #fff, transparent);
      background-size: 200% 200%, 180% 180%, 250% 250%, 220% 220%, 190% 190%, 240% 240%;
      animation: drift 90s linear infinite;
    }
    @keyframes drift{
      0%{ background-position:0% 0%, 40% 40%, 60% 60%, 20% 20%, 80% 80%, 30% 30%; }
      100%{ background-position:100% 100%, -40% -40%, -60% -60%, -20% -20%, -80% -80%, -30% -30%; }
    }
    .dither{
      position:fixed; top:0; bottom:0; width:1px; opacity:.35; z-index:1; pointer-events:none;
      background-image:
        repeating-linear-gradient(0deg, transparent 0px, transparent 1px, var(--fg) 1px, var(--fg) 2px),

    .dither.left{ left:0; }

    .corner{ position:fixed; width:44px; height:44px; z-index:5; pointer-events:none; opacity:.4; }

    .empty{ padding:20px 16px; font-size:11px; color:var(--fg-50); letter-spacing:.05em; }
    .add-link-form{ display:flex; gap:6px; padding:12px; border-top:1px solid var(--fg-15); }
    .add-link-form input{ background:transparent; border:1px solid var(--fg-30); color:var(--fg); font-family:var(--mono); font-size:11.5px; padding:8px 9px; min-width:0; }
    .add-link-form input::placeholder{ color:var(--fg-50); }
    .add-link-form input.name{ flex:0 0 34%; }
    .add-link-form input.url{ flex:1; }
    .add-link-form button{ background:transparent; border:1px solid var(--fg-30); color:var(--fg-70); font-size:14px; padding:0 12px; flex-shrink:0; }
    .add-link-form button:hover{ border-color:var(--fg); color:var(--fg); }
    .new-card{ border:1px dashed var(--fg-30); display:flex; align-items:center; justify-content:center; min-height:180px; color:var(--fg-50); font-size:12px; letter-spacing:.08em; background:none; cursor:pointer; }
    .new-card:hover{ border-color:var(--fg); color:var(--fg); background:var(--fg-15); }
    footer.status{ border-top:1px solid var(--fg-15); padding:12px 28px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; font-size:9.5px; letter-spacing:.1em; color:var(--fg-50); }
    .pulse{ display:flex; gap:4px; align-items:center; }
    .pulse i{ width:4px; height:4px; border-radius:50%; background:var(--fg-30); animation:blink 1.4s infinite ease-in-out; }
    .pulse i:nth-child(2){ animation-delay:.2s; }
    .pulse i:nth-child(3){ animation-delay:.4s; }
    @keyframes blink{ 0%,100%{ opacity:.25; } 50%{ opacity:1; } }
    .overlay{ position:fixed; inset:0; background:rgba(0,0,0,.75); backdrop-filter:blur(2px); display:none; align-items:center; justify-content:center; z-index:50; padding:20px; }
    .overlay.show{ display:flex; }
    .modal{ background:var(--bg); border:1px solid var(--fg-30); width:100%; max-width:360px; padding:22px; }
    .modal h3{ margin:0 0 16px; font-size:13px; letter-spacing:.1em; }

    .modal input{ width:100%; background:transparent; border:1px solid var(--fg-30); color:var(--fg); font-family:var(--mono); font-size:13px; padding:10px; margin-bottom:16px; }
    .modal-actions{ display:flex; justify-content:flex-end; gap:10px; }
    @media (max-width:640px){
      header.topbar{ padding:14px 16px; }

      .add-link-form input.name{ flex:1 1 100%; }
      .search-bar { width: 100%; }
    }
  </style>

<script>
// --- 1. SECURITY & AUTHENTICATION VARIABLES ---
// Pull password from session memory so refreshes don't lock you out
let sessionPassword = sessionStorage.getItem('linkflow_session') || "";
let currentMode = localStorage.getItem('linkflow_vault') ? 'login' : 'setup';
let state = { categories: [] };
let searchQuery = '';

const authOverlay = document.getElementById('auth-overlay');
const authTitle = document.getElementById('auth-title');
const authSubtitle = document.getElementById('auth-subtitle');
const authInput = document.getElementById('auth-input');
const authInputContainer = document.getElementById('auth-input-container');
const authBtn = document.getElementById('auth-btn');
const authError = document.getElementById('auth-error');
const authToggleBtn = document.getElementById('auth-toggle-btn');

// --- 2. ENCRYPTED STORAGE HELPERS ---
function loadEncryptedState() {
  if (!sessionPassword) return { categories: [] };
  try {
    const encrypted = localStorage.getItem('linkflow_secure');
    if (!encrypted) return { categories: [] };
    const bytes = CryptoJS.AES.decrypt(encrypted, sessionPassword);
    const decrypted = bytes.toString(CryptoJS.enc.Utf8);
    const parsed = JSON.parse(decrypted);
    return (parsed && Array.isArray(parsed.categories)) ? parsed : { categories: [] };
  } catch (err) {
    console.error('Decryption failed', err);
    return { categories: [] };
  }
}

function saveEncryptedState() {
  if (!sessionPassword) return;
  try {
    const encrypted = CryptoJS.AES.encrypt(JSON.stringify(state), sessionPassword).toString();
    localStorage.setItem('linkflow_secure', encrypted);
  } catch (err) {
    console.error('Encryption failed', err);
  }
}

// --- 3. AUTHENTICATION LOGIC ---
const authHintInput = document.getElementById('auth-hint-input');
const authTipInput = document.getElementById('auth-tip-input');

function updateAuthView() {
  authError.style.display = 'none';
  authInput.value = '';
  if(authHintInput) authHintInput.value = '';
  if(authTipInput) authTipInput.value = '';
  authInputContainer.style.display = 'block';

  if (currentMode === 'setup') {
    authTitle.innerText = 'INITIAL_SETUP';
    authSubtitle.innerText = 'Create a password & custom recovery phrase.';
    authInput.type = 'password';
    authInput.placeholder = 'Create Master Password';
    authHintInput.style.display = 'block';
    authTipInput.style.display = 'block';
    authBtn.innerText = 'SET PASSWORD';
    authToggleBtn.style.display = 'none';
  } else if (currentMode === 'login') {
    authTitle.innerText = 'LINKFLOW_LOCKED';
    authSubtitle.innerText = 'Enter your master password.';
    authInput.type = 'password';
    authInput.placeholder = '••••••••';
    authHintInput.style.display = 'none';
    authTipInput.style.display = 'none';
    authBtn.innerText = 'UNLOCK';
    authToggleBtn.style.display = 'inline-block';
    authToggleBtn.innerText = 'Forgot Password?';
  } else if (currentMode === 'recovery') {
    authTitle.innerText = 'EMERGENCY_RECOVERY';
    authSubtitle.innerText = 'Enter your secret recovery phrase.';
    authInput.type = 'password';
    authInput.placeholder = 'Your Secret Recovery Phrase';
    authHintInput.style.display = 'none';
    authTipInput.style.display = 'none';
    authBtn.innerText = 'RECOVER PASSWORD';
    authToggleBtn.style.display = 'inline-block';
    authToggleBtn.innerText = 'Back to Login';
  }
}

function handleAuthSubmit() {
  const val = authInput.value.trim();

  if (!val) {
    showError("Input cannot be empty.");
    return;
  }

  if (currentMode === 'setup') {
    const hintVal = authHintInput.value.trim().toLowerCase();
    const tipVal = authTipInput.value.trim();
    
    if (!hintVal || !tipVal) {
      showError("You must enter both a recovery phrase and a hint.");
      return;
    }
    
    // Encrypt and save vault
    const vault = CryptoJS.AES.encrypt(val, hintVal).toString();
    localStorage.setItem('linkflow_vault', vault);
    const token = CryptoJS.AES.encrypt('auth-ok', val).toString();
    localStorage.setItem('linkflow_token', token);
    
    // Save the public hint & initialize intruder counter
    localStorage.setItem('linkflow_tip', tipVal); 
    localStorage.setItem('linkflow_failed_attempts', '0');

    sessionPassword = val;
    sessionStorage.setItem('linkflow_session', val); 
    if (!localStorage.getItem('linkflow_secure')) {
      saveEncryptedState();
    }

    authOverlay.style.display = 'none';
    startApp();
    
  } else if (currentMode === 'login') {
    try {
      const storedToken = localStorage.getItem('linkflow_token');
      if (!storedToken) throw new Error("No token");
      const bytes = CryptoJS.AES.decrypt(storedToken, val);
      
      if (bytes.toString(CryptoJS.enc.Utf8) === 'auth-ok') {
        const failedAttempts = parseInt(localStorage.getItem('linkflow_failed_attempts') || '0', 10);
        if (failedAttempts > 0) {
          alert(`⚠️ SECURITY ALERT: There have been ${failedAttempts} failed login attempts since your last successful login.`);
          localStorage.setItem('linkflow_failed_attempts', '0');
        }

        sessionPassword = val;
        sessionStorage.setItem('linkflow_session', val); 
        authOverlay.style.display = 'none';
        startApp();
      } else throw new Error();
    } catch {
      let attempts = parseInt(localStorage.getItem('linkflow_failed_attempts') || '0', 10);
      localStorage.setItem('linkflow_failed_attempts', attempts + 1);
      
      showError("Incorrect password.");
    }
    
  } else if (currentMode === 'recovery') {
    try {
      const vault = localStorage.getItem('linkflow_vault');
      let recoveredPass = CryptoJS.AES.decrypt(vault, val.toLowerCase()).toString(CryptoJS.enc.Utf8);
      if (!recoveredPass) {
         recoveredPass = CryptoJS.AES.decrypt(vault, val.toUpperCase()).toString(CryptoJS.enc.Utf8);
      }
      
      if (recoveredPass) {
        const failedAttempts = parseInt(localStorage.getItem('linkflow_failed_attempts') || '0', 10);
        if (failedAttempts > 0) {
          alert(`⚠️ SECURITY ALERT: There were ${failedAttempts} failed attempts to guess your password or recovery phrase.`);
          localStorage.setItem('linkflow_failed_attempts', '0');
        }

        authTitle.innerText = 'PASSWORD_RECOVERED';
        authSubtitle.innerHTML = `Your master password is:<br><br><strong style="color: #fff; font-size: 16px;">${recoveredPass}</strong>`;
        authInputContainer.style.display = 'none';
        authBtn.innerText = 'LOGIN NOW';
        authToggleBtn.style.display = 'none';
        authBtn.onclick = () => location.reload();
      } else throw new Error();
    } catch {
      let attempts = parseInt(localStorage.getItem('linkflow_failed_attempts') || '0', 10);
      localStorage.setItem('linkflow_failed_attempts', attempts + 1);
      
      // Pull the hint and show it on failure
      const savedTip = localStorage.getItem('linkflow_tip');
      if (savedTip) {
        showError(`Incorrect. Hint: ${savedTip}`);
      } else {
        showError("Incorrect recovery phrase.");
      }
    }
  }
}

function showError(msg) {
  authError.innerText = msg;
  authError.style.display = 'block';
}

authBtn.addEventListener('click', handleAuthSubmit);
authInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleAuthSubmit(); });
if(authHintInput) authHintInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleAuthSubmit(); });
if(authTipInput) authTipInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleAuthSubmit(); });
authToggleBtn.addEventListener('click', () => {
  currentMode = (currentMode === 'login') ? 'recovery' : 'login';
  updateAuthView();
});
// --- 4. MAIN APP LOGIC (ONLY RUNS AFTER UNLOCK) ---
var uid = function(){ return Math.random().toString(36).slice(2,10); };
function normalizeUrl(u){
  u = (u || '').trim();
  if(!u) return '';
  if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
  return u;
}
function hostOf(u){ try{ return new URL(u).hostname.replace(/^www\./,''); } catch(e){ return u; } }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
}

function render(){
  var grid = document.getElementById('grid');
  grid.innerHTML = '';
  var totalLinks = 0;

  state.categories.forEach(function(cat){
    var filteredLinks = cat.links.filter(function(link) {
      if (!searchQuery) return true;
      return link.name.toLowerCase().includes(searchQuery) || link.url.toLowerCase().includes(searchQuery);
    });

    if (searchQuery && filteredLinks.length === 0 && !cat.name.toLowerCase().includes(searchQuery)) return;
    totalLinks += cat.links.length;

    var card = document.createElement('div');
    card.className = 'card';

    var head = document.createElement('div');
    head.className = 'card-head';
    head.innerHTML =
      '<h2>' + escapeHtml(cat.name) + '</h2>' +
      '<div class="head-right">' +
        '<span class="count">' + filteredLinks.length + '</span>' +
        '<button class="icon-btn" data-del-cat="' + cat.id + '" title="Delete section">✕</button>' +
      '</div>';
    card.appendChild(head);

    var list = document.createElement('ul');
    list.className = 'links';
    
    if(filteredLinks.length === 0){
      var empty = document.createElement('li');
      empty.className = 'empty';
      empty.textContent = searchQuery ? 'NO MATCHING LINKS' : 'NO LINKS YET — ADD YOUR FIRST ONE BELOW';
      list.appendChild(empty);
    } else {
      filteredLinks.forEach(function(link){
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.className = 'link-row';
        a.href = link.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.innerHTML =
          '<span class="glyph">↗</span>' +
          '<span class="meta">' +
            '<div class="name">' + escapeHtml(link.name) + '</div>' +
            '<div class="url">' + escapeHtml(hostOf(link.url)) + '</div>' +
          '</span>' +
          '<button class="del" data-del-link="' + link.id + '" data-cat="' + cat.id + '" title="Remove link">✕</button>';
        li.appendChild(a);
        list.appendChild(li);
      });
    }
    card.appendChild(list);

    if (!searchQuery) {
      var form = document.createElement('div');
      form.className = 'add-link-form';
      form.innerHTML =
        '<input class="name" type="text" placeholder="Name" maxlength="40" />' +
        '<input class="url" type="text" placeholder="URL (e.g. example.com)" maxlength="200" />' +
        '<button title="Add link">+</button>';
      card.appendChild(form);

      var nameInput = form.querySelector('.name');
      var urlInput = form.querySelector('.url');
      var addBtn = form.querySelector('button');

      function submitLink(){
        var name = nameInput.value.trim();
        var url = normalizeUrl(urlInput.value);
        if(!name || !url) return;
        cat.links.push({ id: uid(), name: name, url: url });
        saveEncryptedState();
        render();
      }
      addBtn.addEventListener('click', submitLink);
      [nameInput, urlInput].forEach(function(inp){
        inp.addEventListener('keydown', function(e){ if(e.key === 'Enter') submitLink(); });
      });
    }
    grid.appendChild(card);
  });

  if (!searchQuery) {
    var newCard = document.createElement('button');
    newCard.className = 'new-card';
    newCard.textContent = '+ ADD SECTION';
    newCard.addEventListener('click', openSectionModal);
    grid.appendChild(newCard);
  }

  grid.querySelectorAll('[data-del-cat]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var id = btn.getAttribute('data-del-cat');
      var cat = state.categories.find(function(c){ return c.id === id; });
      if(confirm('Delete "' + (cat ? cat.name : 'this section') + '" and all its links?')){
        state.categories = state.categories.filter(function(c){ return c.id !== id; });
        saveEncryptedState(); render();
      }
    });
  });

  grid.querySelectorAll('[data-del-link]').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.preventDefault();
      var linkId = btn.getAttribute('data-del-link');
      var catId = btn.getAttribute('data-cat');
      var cat = state.categories.find(function(c){ return c.id === catId; });
      if(cat){
        cat.links = cat.links.filter(function(l){ return l.id !== linkId; });
        saveEncryptedState(); render();
      }
    });
  });

  document.getElementById('stat-sections').textContent = state.categories.length + (state.categories.length === 1 ? ' SECTION' : ' SECTIONS');
  document.getElementById('stat-links').textContent = totalLinks + (totalLinks === 1 ? ' LINK' : ' LINKS');
}

// Lock Button Event
document.getElementById('btn-lock').addEventListener('click', function(){
  sessionStorage.removeItem('linkflow_session');
  sessionPassword = "";
  location.reload();
});

document.getElementById('search-input').addEventListener('input', function(e){
  searchQuery = e.target.value.toLowerCase().trim();
  render();
});

document.getElementById('btn-export').addEventListener('click', function(){
  var dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
  var downloadAnchorNode = document.createElement('a');
  downloadAnchorNode.setAttribute("href", dataStr);
  downloadAnchorNode.setAttribute("download", "linkflow_backup.json");
  document.body.appendChild(downloadAnchorNode);
  downloadAnchorNode.click();
  downloadAnchorNode.remove();
});

document.getElementById('file-import').addEventListener('change', function(e){
  var file = e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(event) {
    try {
      var imported = JSON.parse(event.target.result);
      if(imported && Array.isArray(imported.categories)) {
        state = imported;
        saveEncryptedState();
        render();
        alert("Backup successfully restored and encrypted!");
      } else { alert("Invalid JSON format."); }
    } catch(err) { alert("Error reading file."); }
    e.target.value = ''; 
  };
  reader.readAsText(file);
});

document.getElementById('btn-theme').addEventListener('click', function(){
  document.body.classList.toggle('theme-light');
  var isLight = document.body.classList.contains('theme-light');
  localStorage.setItem('linkflow_theme', isLight ? 'light' : 'dark');
});

if(localStorage.getItem('linkflow_theme') === 'light'){
  document.body.classList.add('theme-light');
}

var overlay = document.getElementById('overlay-section');
var sectionInput = document.getElementById('input-section-name');

function openSectionModal(){
  overlay.classList.add('show');
  sectionInput.value = '';
  setTimeout(function(){ sectionInput.focus(); }, 30);
}
function closeSectionModal(){ overlay.classList.remove('show'); }
function confirmSection(){
  var name = sectionInput.value.trim();
  if(!name) return;
  state.categories.push({ id: uid(), name: name, links: [] });
  saveEncryptedState(); closeSectionModal(); render();
}

document.getElementById('btn-add-section').addEventListener('click', openSectionModal);
document.getElementById('cancel-section').addEventListener('click', closeSectionModal);
document.getElementById('confirm-section').addEventListener('click', confirmSection);
sectionInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') confirmSection(); });
overlay.addEventListener('click', function(e){ if(e.target === overlay) closeSectionModal(); });
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeSectionModal(); });

// --- 5. INITIALIZE ---
function startApp() {
  state = loadEncryptedState();
  render();
}

// Bypass login screen if session is already active
if (sessionPassword) {
  authOverlay.style.display = 'none';
  startApp();
} else {
  updateAuthView();
}
</script>
</body>
</html>
